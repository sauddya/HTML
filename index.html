<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my Valentine ❤️</title>

<style>

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: 'Poppins', sans-serif;
    margin:0;
    overflow:hidden;

    background:linear-gradient(135deg,#ff003c,#ff1493,#ff007f);
}

/* Card */

.card{
    background:white;
    padding:50px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 40px rgba(0,0,0,0.3);
}

h1{
    color:#ff007f;
}

/* Buttons */

button{
    border:none;
    padding:12px 30px;
    font-size:18px;
    border-radius:30px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

.yes{
    background:#ff007f;
    color:white;
}

.no{
    background:#ddd;
	color:grey;
}

/* Romantic popup */

.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
    visibility:hidden;
}

.popup-content{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    width:320px;
    animation:pop .5s;
}

@keyframes pop{
    from{transform:scale(0);}
    to{transform:scale(1);}
}

</style>
</head>

<body>

<div class="card">

    <h1>Sweety ! Will you be my Valentine? ❤️</h1>

    <button class="yes" id="yesBtn">Yes 😍</button>
    <button class="no" id="noBtn">No 😢</button>

</div>


<!-- LOVE POPUP -->

<div class="popup" id="popup">
    <div class="popup-content">
		<div class="background-container">
			<img src="C:\Users\Shalini\Documents\Valentine\Shalini\Ask-out-your-Valentine\images\IMG_20190602_104316.jpg" alt="Background Image" style="width: 15%; height: 15%;">
		</div>
        <h2>❤️ I Knew It ❤️</h2>
        <p style="font-size:20px;">
            You just made my world brighter ✨  
            <br><br>
            I promise to hold your hand,
            make you laugh,
            and love you more every single day ❤️  
            <br><br>
            You are mine forever 😘
        </p>
    </div>
</div>


<script>

/* NO BUTTON MESSAGES */

const messages = [
    "Are you sure? 😢",
    "Really sure? 🥺",
    "Think again 💔",
    "Don't break my heart 😭",
    "I will be very sad 😞",
    "Please say yes ❤️",
    "You are my Wife 😍",
    "Ok last chance 😘"
];

let messageIndex = 0;

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");


noBtn.addEventListener("click",()=>{

    // Change message
    noBtn.innerText = messages[messageIndex];
    messageIndex = (messageIndex + 1) % messages.length;

    // Increase YES size
    let currentSize = window.getComputedStyle(yesBtn).fontSize;
    currentSize = parseFloat(currentSize);

    yesBtn.style.fontSize = (currentSize * 1.3) + "px";
    yesBtn.style.padding = "16px 40px";

});


/* YES CLICK */

yesBtn.addEventListener("click",()=>{

    document.getElementById("popup").style.visibility="visible";

});

</script>

</body>
</html>
